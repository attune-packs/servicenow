ref: servicenow.attachment_delete
label: "Delete Attachment"
description: "Delete one allowed attachment by sys_id after metadata verification and exact confirmation"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: servicenow_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: servicenow.credentials, required: true, description: "Pack-owned encrypted ServiceNow profile Key ref"}
  sys_id: {type: string, required: true, pattern: "^[0-9a-fA-F]{32}$", description: "Attachment sys_id"}
  confirmation: {type: string, required: true, description: "Must exactly equal DELETE sys_attachment:<sys_id>"}
  timeout_seconds: {type: integer, minimum: 1, maximum: 120, default: 30}
output:
  operation: {type: string}
  data: {type: object}
  meta: {type: object}
tags: [servicenow, attachment, destructive]
