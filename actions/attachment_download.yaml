ref: servicenow.attachment_download
label: "Download Attachment"
description: "Download one allowed attachment to a confined artifact path using an atomic file replacement"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: servicenow_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: servicenow.credentials, required: true, description: "Pack-owned encrypted ServiceNow profile Key ref"}
  sys_id: {type: string, required: true, pattern: "^[0-9a-fA-F]{32}$", description: "Attachment sys_id"}
  artifact_path: {type: string, required: true, description: "Relative destination beneath ATTUNE_ARTIFACTS_DIR; parent must exist"}
  overwrite: {type: boolean, default: false}
  max_bytes: {type: integer, minimum: 1, maximum: 1073741824, default: 104857600}
  timeout_seconds: {type: integer, minimum: 1, maximum: 120, default: 30}
output:
  operation: {type: string}
  data: {type: object}
  meta: {type: object}
tags: [servicenow, attachment, read, artifact]
