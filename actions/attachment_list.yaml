ref: servicenow.attachment_list
label: "List Record Attachments"
description: "List attachment metadata for one allowed record after verifying its sys_id"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: servicenow_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: servicenow.credentials, required: true, description: "Pack-owned encrypted ServiceNow profile Key ref"}
  table: {type: string, required: true, description: "Table in credential attachment_table_allowlist"}
  record_sys_id: {type: string, required: true, pattern: "^[0-9a-fA-F]{32}$"}
  fields: {type: array, items: {type: string}}
  limit: {type: integer, minimum: 1, maximum: 1000, default: 100}
  offset: {type: integer, minimum: 0, maximum: 1000000, default: 0}
  paginate: {type: boolean, default: false}
  max_records: {type: integer, minimum: 1, maximum: 10000}
  timeout_seconds: {type: integer, minimum: 1, maximum: 120, default: 30}
output:
  operation: {type: string}
  data: {type: array}
  meta: {type: object}
tags: [servicenow, attachment, read]
