ref: servicenow.cmdb_ci_lookup
label: "Look Up CMDB CI"
description: "Look up a base cmdb_ci record by preferred sys_id or exact validated name"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: servicenow_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: servicenow.credentials, required: true, description: "Pack-owned encrypted ServiceNow profile Key ref"}
  sys_id: {type: string, pattern: "^[0-9a-fA-F]{32}$", description: "Preferred exact CI identifier"}
  name: {type: string, maxLength: 255, description: "Exact CI name when sys_id is unavailable"}
  fields: {type: array, items: {type: string}}
  limit: {type: integer, minimum: 1, maximum: 100, default: 20}
  offset: {type: integer, minimum: 0, maximum: 1000000, default: 0}
  timeout_seconds: {type: integer, minimum: 1, maximum: 120, default: 30}
output:
  operation: {type: string}
  data: {type: any}
  meta: {type: object}
tags: [servicenow, cmdb, read]
