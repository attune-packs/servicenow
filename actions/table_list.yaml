ref: servicenow.table_list
label: "List Allowed Table Records"
description: "List fields from a credential-allowlisted ServiceNow table with bounded offset pagination"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: servicenow_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: servicenow.credentials, required: true, description: "Pack-owned encrypted ServiceNow profile Key ref"}
  table: {type: string, required: true, description: "Credential-allowlisted ServiceNow table API name"}
  fields: {type: array, items: {type: string}, description: "Read-allowlisted fields; defaults to all allowed fields"}
  query: {type: string, maxLength: 4096, description: "Validated read-only ServiceNow encoded query"}
  limit: {type: integer, minimum: 1, maximum: 1000, default: 100, description: "Records requested per page"}
  offset: {type: integer, minimum: 0, maximum: 1000000, default: 0}
  paginate: {type: boolean, default: false, description: "Fetch successive sysparm_offset pages"}
  max_records: {type: integer, minimum: 1, maximum: 10000, description: "Total bound when paginate is true"}
  timeout_seconds: {type: integer, minimum: 1, maximum: 120, default: 30}
output:
  operation: {type: string}
  data: {type: array}
  meta: {type: object}
tags: [servicenow, table, read]
