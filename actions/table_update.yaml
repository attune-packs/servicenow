ref: servicenow.table_update
label: "Update Allowed Table Record"
description: "Patch one record by sys_id using allowlisted non-lifecycle fields and optional conflict guards"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: servicenow_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: servicenow.credentials, required: true, description: "Pack-owned encrypted ServiceNow profile Key ref"}
  table: {type: string, required: true}
  sys_id: {type: string, required: true, pattern: "^[0-9a-fA-F]{32}$"}
  record: {type: object, required: true, description: "Flat object containing only allowlisted write fields"}
  expected_sys_updated_on: {type: string, description: "Reject when a preflight read has a different sys_updated_on"}
  if_match: {type: string, description: "ETag value from an earlier response, when supported by the instance"}
  timeout_seconds: {type: integer, minimum: 1, maximum: 120, default: 30}
output:
  operation: {type: string}
  data: {type: object}
  meta: {type: object}
tags: [servicenow, table, write]
